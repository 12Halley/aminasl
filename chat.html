<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e22">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/paginas.css"><link rel="stylesheet" href="css/app.css">
<title>Chat privado</title>
</head>
<body>
<div class="chat">
  <header class="chat-top">
    <a class="sair" href="index.html" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Chat privado<small id="sub">A ligar…</small></h1>
    <button id="sair" type="button" aria-label="Terminar sessão" title="Terminar sessão">Sair</button>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"><div class="estado" id="estado">A carregar mensagens…</div></div>
  <div class="estado erro" id="aviso" role="alert" hidden></div>
  <form class="compor" id="form">
    <label class="sr-only" for="txt">Mensagem</label>
    <textarea id="txt" rows="1" maxlength="2000" placeholder="Escreve uma mensagem…" autocomplete="off"></textarea>
    <button type="submit" id="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M3.5 11.5L20.5 4l-4 16-4.5-6.5z"/><path d="M12 13.5l8.5-9.5"/></svg></button>
  </form>
</div>
<script type="module">import "./js/ui.js"; import "./js/chat.js";</script>
</body>
</html>
